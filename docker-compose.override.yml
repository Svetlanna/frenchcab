services:
  backend:
    build: ./backend
    container_name: conteneur-back
    volumes:
      - ./backend/data:/app/data 

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_CONFIG: development
    container_name: conteneur-front
  
    volumes:
      - ./frontend:/app
  
  gateway:
    build: ./gateway
    container_name: conteneur-gateway
  
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,conteneur-back,conteneur-back:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  mlflow_data:
