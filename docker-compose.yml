services:
  backend:
    #image: emfall/frenchcab-backend:latest
    build: ./backend
    container_name: conteneur-back
    ports:
      - "3001:3001"
    #volumes:
     # - ./backend:/app
     # - /app/node_modules
     # - ./backend/data:/app/data 
    restart: always

  frontend:
    #image: emfall/frenchcab-frontend:latest
    build: ./frontend
    container_name: conteneur-front
    ports:
      - "4200:80"
    #volumes:
      #- ./frontend:/app
    depends_on:
      - backend
    restart: always

  ml:
    build: ./backend/ML
    container_name: conteneur-ml
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    restart: always
volumes:
  frontend:
  backend:
