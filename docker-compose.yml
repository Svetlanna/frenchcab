services:
  backend:
    image: emfall/frenchcab-backend:latest
    container_name: conteneur-back
    ports:
      - "3001:3001"
    volumes:
     - ./data:/app/data 
    restart: always

  frontend:
    image: emfall/frenchcab-frontend:latest
    container_name: conteneur-front
    ports:
      - "4200:80"

    depends_on:
      - gateway
    restart: always


  gateway:
    image: emfall/frenchcab-gateway:latest

    container_name: conteneur-gateway
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
