server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker : la gateway est résolue à la requête,
    # nginx démarre donc même si le conteneur gateway n'est pas encore là
    resolver 127.0.0.11 valid=30s;
    set $gateway http://gateway:3000;

    # Appels API du front en production : /api/zones -> http://gateway:3000/zones
    # (même origine que la page, donc en https sur la VM et sans mixed content)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
